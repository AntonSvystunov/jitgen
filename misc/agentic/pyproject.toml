[project]
name = "agentic"
version = "0.1.0"
description = "CodeAct agent evaluation comparing sync vs async (JITGen) execution strategies using LangGraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.4.1",
    "huggingface>=0.0.1",
    "huggingface-hub>=1.1.5",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jitgen",
    "jitgen-langchain",
    "langchain>=1.0.8",
    "langchain-ollama>=1.0.0",
    "langgraph>=0.4.1",
    "matplotlib>=3.10.8",
    "pandas>=2.2.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "tqdm>=4.67.1",
]

[tool.uv.sources]
jitgen = { path = "../../libs/jitgen", editable = true }
jitgen-langchain = { path = "../../libs/langchain", editable = true }

[project.scripts]
agentic-eval = "agentic:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
