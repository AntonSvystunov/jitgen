[project]
name = "jitgen-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AntonSvystunov", email = "antonsvistunov99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.4.1",
    "huggingface>=0.0.1",
    "huggingface-hub>=1.1.5",
    "jitgen",
    "jitgen-langchain",
    "langchain>=1.0.8",
    "langchain-ollama>=1.0.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
]

[tool.uv.sources]
jitgen = { path = "../../libs/jitgen", editable = true }
jitgen-langchain = { path = "../../libs/langchain", editable = true }

[project.scripts]
jitgen-eval = "jitgen_eval:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
