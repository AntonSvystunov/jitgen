[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jitgen-openai"
version = "0.1.0"
description = "OpenAI tool-call segmenter, MCP tool bridge, and Incremental-PTC agent loop for JitGen."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "AntonSvystunov", email = "antonsvistunov99@gmail.com" }
]
dependencies = [
    "jitgen",
    "langsmith>=0.4",
    "mcp>=1.2.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
# JavaScript `eval` code for the agents (`language="javascript"`).
js = ["jitgen-js"]

[tool.uv.sources]
jitgen = { path = "../jitgen", editable = true }
jitgen-js = { path = "../jitgen-js", editable = true }

[dependency-groups]
test = [
    "jitgen-js",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["jitgen_openai"]
