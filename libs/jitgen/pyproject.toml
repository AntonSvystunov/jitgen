[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jitgen"
version = "0.1.0"
description = "Incremental grammar-guided execution framework for LLM generated code."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "AntonSvystunov", email = "antonsvistunov99@gmail.com" }
]
dependencies = [
    "lark>=1.3.1",
    "pydantic>=2.12.4",
]

[dependency-groups]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["jitgen"]
