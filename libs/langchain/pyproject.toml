[project]
name = "jitgen-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AntonSvystunov", email = "antonsvistunov99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jitgen",
    "langchain>=1.0.8",
]

[tool.uv.sources]
jitgen = { path = "../jitgen", editable = true }

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"